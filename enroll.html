<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enroll | Data Skill Hatch</title>
<meta name="description" content="Enroll for the upcoming Data Skill Hatch batch.">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--ink:#24476D;--night:#173250;--blue:#3A7CBA;--yolk:#8CC0F0;--mist:#EAF1F8;--line:#D9E0EE;--text:#33405F;--white:#fff;--r:10px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font:17px/1.65 "Inter",system-ui,sans-serif;color:var(--text);background:#fff;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Outfit","Inter",sans-serif;color:var(--ink);line-height:1.12;letter-spacing:-.02em}
h1{font-size:clamp(2.4rem,5.2vw,4rem);font-weight:700}
h2{font-size:clamp(1.8rem,3.4vw,2.6rem);font-weight:700}
h3{font-size:1.2rem;font-weight:600}
a{color:var(--blue)}
img{max-width:100%}
:focus-visible{outline:3px solid var(--yolk);outline-offset:3px}
.wrap{max-width:1120px;margin:auto;padding:0 24px}
.narrow{max-width:680px}

/* nav */
.nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:28px;height:68px}
.brand img{height:46px;width:auto;display:block}
.nav nav{display:flex;gap:6px;margin-left:auto}
.nav nav a{color:var(--ink);text-decoration:none;font-weight:500;padding:8px 12px;border-radius:8px}
.nav nav a:hover,.nav nav a[aria-current]{background:var(--mist)}
.btn{display:inline-block;background:var(--ink);color:#fff;font-weight:700;text-decoration:none;padding:11px 20px;border-radius:8px;border:2px solid var(--ink);transition:background .15s}.hero .btn:not(.ghost),.cta .btn:not(.ghost){background:#fff;border-color:#fff;color:var(--ink)}.hero .btn:not(.ghost):hover,.cta .btn:not(.ghost):hover{background:var(--yolk);border-color:var(--yolk)}
.btn:hover{background:#1c3a5a}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.btn.ghost:hover{background:rgba(255,255,255,.1)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}.btn.dark:hover{background:#1c3a5a}
.btn.dark:hover{background:#1c2b57}

/* hero */
.hero{background:linear-gradient(rgba(23,50,80,.9),rgba(23,50,80,.9)),var(--hero-img,none) center/cover var(--night);color:#C6D8EC;padding:72px 0 80px}
.hero-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center}
.hero h1{color:#fff;margin-bottom:20px}
.hero p.lead{font-size:1.15rem;max-width:34em;margin-bottom:24px}
.ticks{list-style:none;padding:0;margin:0 0 32px;display:grid;gap:6px}
.ticks li::before{content:"";display:inline-block;width:.55em;height:.55em;background:var(--yolk);border-radius:50%;margin-right:.7em}
.actions{display:flex;gap:12px;flex-wrap:wrap}

/* hero dashboard */
.win{background:#fff;border-radius:14px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);overflow:hidden;color:var(--text)}
.tabs{display:flex;background:var(--mist);border-bottom:1px solid var(--line)}
.tabs button{flex:1;font:600 .95rem "Inter",sans-serif;padding:13px 8px;border:0;background:none;color:var(--text);cursor:pointer;border-bottom:3px solid transparent}
.tabs button[aria-selected=true]{background:#fff;color:var(--ink);border-bottom-color:var(--blue)}
.panel{padding:26px;min-height:290px}
.panel[hidden]{display:none}
.kpis{display:flex;gap:28px;margin-bottom:22px}
.kpis b{display:block;font:700 1.7rem "Outfit",sans-serif;color:var(--ink)}
.kpis span{font-size:.85rem}
.bars{display:flex;align-items:flex-end;gap:12px;height:150px;border-bottom:2px solid var(--line)}
.bars i{flex:1;background:var(--blue);border-radius:4px 4px 0 0;height:var(--h)}
.bars i:nth-child(4){background:var(--yolk)}
.labels{display:flex;gap:12px;font-size:.8rem;margin-top:6px}
.labels span{flex:1;text-align:center}
pre{font:.92rem/1.7 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);white-space:pre-wrap}
pre em{font-style:normal;color:var(--blue);font-weight:700}
.result{margin-top:16px;border:1px solid var(--line);border-radius:8px;font-size:.9rem}
.result div{display:flex;justify-content:space-between;padding:8px 14px}
.result div+div{border-top:1px solid var(--line)}
.result div:first-child{background:var(--mist);font-weight:600}

/* facts strip */
.facts{background:var(--ink);color:#fff}
.facts .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 32px;padding-top:20px;padding-bottom:20px}
.facts b{font:700 1.5rem "Outfit",sans-serif;margin-right:.4em}

/* sections */
.section{padding:88px 0}
.section.tint{background:var(--mist)}
.head{max-width:620px;margin-bottom:44px}
.head p{margin-top:12px}
.split{display:grid;grid-template-columns:1fr 1.4fr;gap:64px}
.feature-list{display:grid;gap:0}
.feature-list div{padding:22px 0;border-top:1px solid var(--line)}
.feature-list div:last-child{border-bottom:1px solid var(--line)}
.feature-list p{margin-top:4px}

/* programs */
.programs{display:grid;gap:0;border-top:2px solid var(--ink)}
.prog{display:grid;grid-template-columns:90px 1.1fr 1.4fr;gap:28px;padding:30px 0;border-bottom:1px solid var(--line);align-items:start}
.tag{font-weight:700;font-size:.9rem;color:var(--blue);padding-top:4px}
.prog h3{margin-bottom:8px}
.prog ul{margin:0;padding-left:1.1em;columns:2;column-gap:28px}
.prog.full{background:var(--night);color:#C6D8EC;padding:30px 24px;margin:18px 0;border-radius:var(--r);border:0}
.prog.full h3{color:#fff}.prog.full .tag{color:var(--yolk)}

/* audience */
.who{display:grid;grid-template-columns:repeat(2,1fr);gap:0 56px}
.who div{padding:22px 0;border-top:1px solid var(--line)}

/* cta */
.cta{background:var(--night);color:#C6D8EC;padding:72px 0}
.cta .wrap{display:flex;justify-content:space-between;align-items:center;gap:32px;flex-wrap:wrap}
.cta h2{color:#fff;max-width:14em}
.page-head{background:var(--night);padding:64px 0}
.page-head h1{color:#fff;font-size:clamp(2.1rem,4.4vw,3.2rem)}
.page-head p{color:#C6D8EC;margin-top:10px}
.contact-list{display:grid;gap:18px;margin-top:8px}
.contact-list a{font-weight:600}
iframe{width:100%;height:760px;border:1px solid var(--line);border-radius:var(--r)}

footer{background:#10253B;color:#9DB3CC;padding:28px 0;font-size:.92rem}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.whatsapp-float{position:fixed;right:20px;bottom:20px;width:54px;height:54px;border-radius:50%;background:#25D366;display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.25);z-index:30}
.whatsapp-float svg{width:28px;height:28px;fill:#fff}

@media(max-width:860px){
 .hero-grid,.split{grid-template-columns:1fr;gap:40px}
 .prog{grid-template-columns:1fr;gap:10px}
 .who{grid-template-columns:1fr}
 .section{padding:64px 0}
 .nav-in{flex-wrap:wrap;height:auto;padding-top:10px;padding-bottom:10px;gap:8px 16px}
 .nav nav{order:3;width:100%;margin:0;overflow-x:auto}
 .btn{margin-left:auto}
}
@media(max-width:520px){.prog ul{columns:1}.kpis{gap:18px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>

<script>// Hero tabs (Power BI / SQL / Python)
document.querySelectorAll('.tabs button').forEach(function (btn) {
  btn.addEventListener('click', function () {
    document.querySelectorAll('.tabs button').forEach(function (b) { b.setAttribute('aria-selected', b === btn); });
    document.querySelectorAll('.panel').forEach(function (p) { p.hidden = p.id !== btn.dataset.panel; });
  });
});
// Footer year
document.querySelectorAll('[data-year]').forEach(function (el) { el.textContent = new Date().getFullYear(); });
</script>
</body>
